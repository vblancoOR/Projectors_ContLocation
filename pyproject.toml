[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdp-clusters"
version = "0.1.0"
description = "Projector-based conic formulations for continuous multifacility location"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "gurobipy>=11",
  "Mosek>=10",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbformat>=5", "pandas>=2"]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["sdp_clusters", "sdp_projector_search", "projector_master"]

[tool.pytest.ini_options]
testpaths = ["tests"]

